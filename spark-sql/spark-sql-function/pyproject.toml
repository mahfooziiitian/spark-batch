[project]
name = "spark-sql-function"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []


[dependency-groups]
dev = [
    "python-dotenv>=1.1.1",
    "sphinxawesome-theme>=5.3.2",
    "linkify-it-py>=2.0.3",
    "myst-parser>=4.0.0",
    "sphinx>=8.1.3",
    "taskipy>=1.14.1",
    "sphinx-autoapi>=3.6.0",
    "coverage>=7.7.1",
    "pytest-cov>=6.0.0",
    "sphinx-test-reports>=1.1.0",
    "sphinxcontrib-mermaid>=1.0.0",
    "sphinxcontrib-plantuml>=0.30",
    "sphinx-book-theme>=1.1.4",
    "black[jupyter]>=25.1.0",
    "isort>=6.0.1",
    "flake8-pyproject>=1.2.3",
    "sphinx-autobuild>=2024.10.3",
]

[tool.flake8]
max-line-length = 128
extend-ignore = [
    "E203",  # Whitespace before ':'
]

[tool.taskipy.tasks]
# test
test = "uv run pytest --cov=md --cov-report json:coverage.json tests"

# code quality
lint = "uv run flake8 src"
format = "uv run black ."
isort = "uv run isort --profile black ."
quality = "task isort && task format && task lint"

# docs
sphinx_qs = "uv run sphinx-quickstart docs/source --sep --project spark-sql-function --author 'Mohammad Mahfooz Alam' --release 0.1.0 --language en --extensions sphinx.ext.viewcode,sphinx.ext.napoleon,sphinx.ext.todo,sphinx.ext.graphviz,sphinxcontrib.mermaid"
clean = "rm -rf docs/build"
html = "uv run sphinx-build -b html docs/source docs/build/html/"
single_html = "uv run sphinx-build -b singlehtml docs/source docs/build/singlehtml/"
server = "uv run python -m http.server -d ./docs/build/html 8080"
html_server = "task clean && task html && task server"
sphinx_autobuild="uv run sphinx-autobuild docs/source docs/build/html --port 8080 --open-browser --watch docs"

