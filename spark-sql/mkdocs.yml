site_name: Spark SQL
site_description: Comprehensive documentation for Spark SQL 4.0
site_url: https://github.com/mahfooziiitian/spark-batch/tree/master/spark-sql
strict: true

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.tabs.link
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    logo: material/database

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: relative_to_docs
  links:
    not_found: info
    anchors: info
    absolute_links: relative_to_docs
    unrecognized_links: info

extra_css:
  - assets/css/timeseries-viz.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js
  - assets/js/timeseries-viz.js
  - assets/js/scd-viz.js
  - assets/js/patterns-viz.js
  - assets/js/window-frame-viz.js
  - assets/js/window-nulls-viz.js
  - assets/js/window-overview-viz.js
  - assets/js/application-patterns-viz.js
  - assets/js/patterns-overview-viz.js
