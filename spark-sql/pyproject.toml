[project]
name = "spark-sql"
version = "1.0.0"
description = "Spark SQL learning resource — tutorials, demos, architecture deep-dives, and performance optimization for Apache Spark 4 and Databricks Runtime"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "Mahfooz Alam" }]
keywords = ["spark", "sql", "pyspark", "databricks", "data-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: SQL",
    "Framework :: Pytest",
]

dependencies = [
    "graphviz>=0.21",
    "ipykernel>=6.30.0",
    "pyspark>=4.0.0",
    "sqlalchemy>=2.0.43",
    "databricks-sdk>=0.105.0",
    "mcp[cli]<2.0.0",
    "pydantic-settings>=2.14.2",
]

[project.urls]
Repository = "https://github.com/mahfooziiitian/spark-batch/tree/master/spark-sql"
Documentation = "https://github.com/mahfooziiitian/spark-batch/tree/master/spark-sql/docs"
Issues = "https://github.com/mahfooziiitian/spark-batch/issues"

[dependency-groups]
dev = [
    # Code quality
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "radon>=6.0.1",
    # Testing
    "pytest>=9.1.1",
    "pytest-sugar>=1.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14.1",
    "pytest-xdist>=3.5.0",
    "pytest-datadir>=1.8.0",
    "chispa>=0.12.0",
    "ipytest>=0.14.2",
    # Security
    "bandit[toml]>=1.9.4",
    "safety>=3.6.0",
    # SQL linting
    "sqlfluff>=3.3.1",
    # Tasks
    "taskipy>=1.14.1",
    # Docs
    "mkdocs>=1.6.0,<2",
    "mkdocs-material>=9.7.4,<10",
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocs-include-markdown-plugin>=6.0.0",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "linkify-it-py>=2.0.3",
    "pymarkdownlnt>=0.9.31",
]

# ─── Ruff (replaces black, isort, flake8) ────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 128
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["spark_sql"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ─── SQLFluff ─────────────────────────────────────────────────────────────────

[tool.sqlfluff.core]
dialect = "sparksql"
templater = "jinja"
sql_file_exts = ".sql,.sql.j2,.dml,.ddl"
max_line_length = 120
large_file_skip_byte_limit = 25000

[tool.sqlfluff.indentation]
indented_joins = false
indented_using_on = true
template_blocks_indent = false

[tool.sqlfluff.templater]
unwrap_wrapped_queries = true

[tool.sqlfluff.templater.jinja]
apply_dbt_builtins = true

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.identifiers]
capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.functions]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.literals]
capitalisation_policy = "upper"

# ─── Pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "-q", "--strict-markers", "--strict-config", "--tb=short"]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "smoke: quick sanity checks",
    "slow: tests that take >10s",
    "integration: requires external services (Spark cluster, DB)",
    "unit: isolated unit tests",
    "spark: requires a SparkSession",
]
filterwarnings = ["ignore::DeprecationWarning:pyspark.*"]

# ─── Coverage ─────────────────────────────────────────────────────────────────

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

[tool.coverage.html]
directory = "reports/htmlcov"

# ─── MyPy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

# ─── Bandit ───────────────────────────────────────────────────────────────────

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", ".venv", "docs"]
severity = "medium"
confidence = "high"

# ─── Taskipy ─────────────────────────────────────────────────────────────────

[tool.taskipy.tasks]
# Testing
test = "uv run pytest -vv tests"
test_fast = "uv run pytest -x -q tests"
test_cov = "uv run pytest --cov=src --cov-report=term-missing --cov-report=html:reports/htmlcov tests"
test_parallel = "uv run pytest -n auto tests"

# Code quality
format = "uv run ruff format src tests"
format_check = "uv run ruff format --check src tests"
lint = "uv run ruff check src tests"
lint_fix = "uv run ruff check --fix src tests"
type_check = "uv run mypy src"
quality = "task format && task lint && task type_check && task sql_lint"

# SQL
sql_format = "uv run sqlfluff fix src --force"
sql_lint = "uv run sqlfluff lint src"
sql = "task sql_format && task sql_lint"

# Security
bandit = "uv run bandit -c pyproject.toml -r src"
safety = "uv run safety check"
secure = "task bandit && task safety"

# Documentation
docs_build = "uv run mkdocs build --strict"
docs_serve = "uv run mkdocs serve -a 0.0.0.0:8000 --livereload"
docs_lint = "uv run pymarkdownlnt fix -r docs README.md"
docs = "task docs_build && task docs_serve"

# Reports
report_xml = "uv run pytest --junitxml=reports/report.xml tests"
report_cov = "uv run pytest --cov=src --cov-report=xml:reports/coverage.xml --cov-report=term-missing tests"

# Housekeeping
clean = "rm -rf __pycache__ .pytest_cache .mypy_cache .ruff_cache site reports/htmlcov"

# CI pipeline (run all checks)
ci = "task format_check && task lint && task type_check && task sql_lint && task test_cov && task docs_build"

[project.scripts]
dbx-copilot-mcp = "spark_sql.server:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spark_sql"]
