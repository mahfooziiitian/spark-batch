site_name: PySpark Architecture
site_description: Apache Spark architecture — components, internals, and cluster managers explained with PySpark examples
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Components:
      - SparkSession: components/spark-session.md
      - SparkContext: components/spark-context.md
      - Driver: components/driver.md
      - Driver Memory: components/driver-memory.md
      - Executor: components/executor.md
      - Executor Memory: components/executor-memory.md
      - Catalyst Optimizer: components/catalyst.md
      - Query Plans: components/query-plans.md
      - Shuffle: components/shuffle.md
      - Memory Management: components/memory.md
  - Cluster Managers:
      - Local: cluster-managers/local.md
      - YARN: cluster-managers/yarn.md
      - Kubernetes: cluster-managers/kubernetes.md
