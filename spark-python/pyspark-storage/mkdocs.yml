site_name: PySpark Storage
site_description: PySpark examples for reading and writing data to cloud and local object storage systems
site_url: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - monorepo
  - include-markdown

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Storage Providers:
      - AWS S3: '!include ./pyspark-aws-s3/mkdocs.yml'
      - Azure Storage: '!include ./pyspark-azure-storage/mkdocs.yml'
      - GCP Storage: '!include ./pyspark-gcp-storage/mkdocs.yml'
      - HDFS: '!include ./pyspark-hdfs/mkdocs.yml'
      - LocalStack S3: '!include ./pyspark-local-s3/mkdocs.yml'
      - MinIO: '!include ./pyspark-minio/mkdocs.yml'
