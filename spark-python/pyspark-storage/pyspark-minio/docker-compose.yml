services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh -c
    command:
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb local/spark-demo --ignore-existing
        mc cp /data/sample.csv local/spark-demo/input/sample.csv
        echo "Setup complete"
    volumes:
      - ./data:/data:ro

volumes:
  minio-data:
