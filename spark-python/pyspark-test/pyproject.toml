[project]
name = "pyspark-test"
version = "0.1.0"
description = "PySpark testing reference mono-repo — Chispa, PyDeequ, and pytest patterns"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.5",
    "mkdocs-monorepo-plugin>=1.1.2",
]

[tool.taskipy.tasks]
docs       = "mkdocs build --strict"
docs_serve = "mkdocs serve"
