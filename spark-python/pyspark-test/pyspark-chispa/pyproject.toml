[project]
name = "pyspark-chispa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy<2", "pandas>=2.3.3", "pyspark<4.0.0"]

[dependency-groups]
dev = [
    "chispa>=0.11.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.5",
    "mypy>=1.15",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.11",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
test = "pytest -x --tb=short"
test_parallel = "pytest -n auto --tb=short"
test_verbose = "pytest -x -v --tb=long"
lint = "ruff check src tests"
lint_fix = "ruff check --fix src tests"
format = "ruff format src tests"
format_check = "ruff format --check src tests"
typecheck = "mypy src"
docs = "mkdocs build --strict"
docs_serve = "mkdocs serve"
check = "task lint && task format_check && task typecheck && task test"
clean = "find . -type d -name __pycache__ -exec rm -rf {} + && rm -rf .mypy_cache .pytest_cache .ruff_cache dist *.egg-info"

[tool.pytest.ini_options]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
