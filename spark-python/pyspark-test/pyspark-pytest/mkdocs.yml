site_name: pyspark-pytest
site_description: PySpark testing patterns with pytest and pyspark.testing
repo_url: https://github.com/mahfooziiitian/spark-batch

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Project Structure: getting-started/project-structure.md
  - API Reference:
      - Data Processing: api/data-processing.md
      - CSV Reader: api/reader.md
      - Transformations: api/transformations.md
  - Utilities:
      - Faker Data Generation: utilities/faker.md
      - Docker: utilities/docker.md
  - Testing:
      - Overview: testing/overview.md
      - DataFrame Assertions: testing/dataframe-assertions.md
      - Mock Testing: testing/mock-testing.md
