site_name: Spark XML — PySpark XML Processing
site_description: A comprehensive guide to XML processing with PySpark and the Databricks spark-xml library
repo_url: https://github.com/databricks/spark-xml

theme:
  name: material
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.tabs
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
      - Reading XML: guide/reading.md
      - Writing XML: guide/writing.md
      - Schema Handling: guide/schema.md
      - Nested XML: guide/nested.md
      - Encoding: guide/encoding.md
      - Compression: guide/compression.md
      - Namespaces: guide/namespaces.md
      - Attributes: guide/attributes.md
      - Value Tags: guide/value-tags.md
      - SQL Interface: guide/sql.md
      - Error Handling: guide/error-handling.md
  - API Reference: api/reference.md
  - Examples: examples/index.md
