site_name: Spark XPath
site_description: Extract and transform XML data in PySpark using XPath functions
repo_url: https://github.com/<owner>/<repo>

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    logo: material/xml
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - toc.follow

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - XPath Functions Reference: xpath-functions.md
  - Examples:
      - Basic XML Parsing: examples/basic-parsing.md
      - Numeric Extraction: examples/numeric-extraction.md
      - Conditional Logic: examples/conditional-logic.md
      - Array Flattening: examples/array-flattening.md
      - Nested XML: examples/nested-xml.md
      - Credit Evaluation: examples/credit-evaluation.md
  - API Reference: api-reference.md
  - Testing Guide: testing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/<owner>/<repo>
