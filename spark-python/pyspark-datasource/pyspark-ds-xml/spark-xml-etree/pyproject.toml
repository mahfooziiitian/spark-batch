[project]
name = "spark-xml-etree"
version = "0.1.0"
description = "PySpark examples for parsing XML with Python's xml.etree.ElementTree via UDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyspark<4.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.8.0",
    "pytest-sugar>=1.1.1",
    "pytest-mock>=3.15.1",

    "ruff>=0.9.0",
    "bandit>=1.9.4",
    "safety>=3.7.0",
    "taskipy>=1.14.1",

    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

# ── taskipy tasks ────────────────────────────────────────────────────────────

[tool.taskipy.tasks]

# Linting & formatting
lint = { cmd = "ruff check src/ tests/", help = "Run ruff linter on src and tests" }
lint-fix = { cmd = "ruff check src/ tests/ --fix", help = "Auto-fix linting issues" }
format = { cmd = "ruff format src/ tests/", help = "Format code with ruff" }
format-check = { cmd = "ruff format src/ tests/ --check", help = "Check formatting without changes" }

# Security
security = { cmd = "bandit -r src/ -c pyproject.toml", help = "Run bandit security scanner" }
audit = { cmd = "safety scan", help = "Audit dependencies for known vulnerabilities" }

# Testing
test = { cmd = "pytest tests/ -v --tb=short", help = "Run all tests (verbose)" }
test-fast = { cmd = "pytest tests/ -x -q", help = "Run tests, stop on first failure" }
test-cov = { cmd = "pytest tests/ --cov=spark_etree --cov-report=term-missing --cov-report=html", help = "Run tests with coverage report" }
test-parallel = { cmd = "pytest tests/ -n auto --tb=short", help = "Run tests in parallel with xdist" }

# Documentation
docs = { cmd = "mkdocs serve --livereload", help = "Serve docs locally at http://127.0.0.1:8000" }
docs-build = { cmd = "mkdocs build --strict", help = "Build docs (strict mode — fail on warnings)" }

# Quality gates (CI)
check = { cmd = "task lint && task format-check && task security && task test", help = "Run all quality checks (lint + format + security + test)" }
ci = { cmd = "task lint && task format-check && task security && task audit && task test-cov && task docs-build", help = "Full CI pipeline" }

# Cleanup
clean = { cmd = "rm -rf .pytest_cache .mypy_cache .ruff_cache .coverage htmlcov site/ dist/ build/ **/__pycache__", help = "Remove build and cache artifacts" }

# ── tool configuration ───────────────────────────────────────────────────────

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "N812",   # lowercase imported as non-lowercase (PySpark convention: functions as F)
    "SIM108", # ternary operator suggestion
]

[tool.ruff.lint.isort]
known-first-party = ["spark_etree"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B314", "B405"]

[tool.coverage.run]
source = ["spark_etree"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "@udf",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spark_etree"]
