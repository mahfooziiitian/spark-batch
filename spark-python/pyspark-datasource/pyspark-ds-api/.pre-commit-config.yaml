repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]

      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]

      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        types: [python]
        files: ^(src|examples)/

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        args: ["src/rest_ds"]
        files: ^src/

      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml
        language: system
        types: [python]
        files: ^src/
