repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]

      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types: [python]

      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        types: [python]
        files: ^(src|examples)/

      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types: [python]
        files: ^src/

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        args: ["src/rest_ds"]
        files: ^src/

      - id: radon
        name: radon (cyclomatic complexity)
        entry: uv run radon cc -nb
        language: system
        pass_filenames: false
        args: ["src/rest_ds"]
        files: ^src/

      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml
        language: system
        types: [python]
        files: ^src/

      - id: gitleaks
        name: gitleaks (hardcoded secrets scan)
        entry: gitleaks detect --source . --no-git -v
        language: system
        pass_filenames: false
