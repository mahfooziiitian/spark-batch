extracts:
  extract:
    exec: read_api
    source:
      params:
        format: "api"
        schema: "api_tls_schema.json"
        location: "https://localhost:8443/students"
        options:
          method: "GET"
          authentication:
            type: "mtls"
            certFile: "${DATA_HOME}/rest_api_ds/certs/client.pem"
            keyFile: "${DATA_HOME}/rest_api_ds/certs/client.key"
            caFile: "${DATA_HOME}/rest_api_ds/certs/ca.pem"
          headers:
            Accept: "application/json"
          responseFormat: "json"
          retries:
            maxAttempts: 3
            delaySeconds: 5
          filepath: "${DATA_HOME}/rest_api_ds/api_mtls_etl.json"