extracts:
  extract:
    exec: read_api
    source:
      params:
        format: "api"
        schema: "json"
        location: "http://localhost:8081/students"
        options:
          method: "GET"
          session_timeout: 30
          authentication:
            method: "POST"
            headers:
              Content-Type: "application/json"
            type: "oauth2_password_json"
            tokenUrl: "http://localhost:8081/token"
            username_key: "username"
            password_key: "password"
            username_value: "admin"
            password_value: "admin123"
            grant_type_key: "grant_type"
            grant_type_value: "password"
          headers:
            Accept: "application/json"
          queryParams:
            q: "daft punk"
            type: "artist"
          responseFormat: "json"
          retries:
            maxAttempts: 3
            delaySeconds: 5
          filepath: "${DATA_HOME}/rest_api_ds/api_oauth2_password_json_etl.json"