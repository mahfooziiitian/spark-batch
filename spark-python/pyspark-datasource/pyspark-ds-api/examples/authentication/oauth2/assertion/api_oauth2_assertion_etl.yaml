extracts:
  extract:
    exec: read_api
    source:
      params:
        format: "api"
        schema: "json"
        location: "http://localhost:8081/students"
        options:
          method: "GET"
          session_timeout: 30
          authentication:
            type: "oauth2_assertion"
            tokenUrl: "http://localhost:8081/token"
            public_key_path: "${DATA_HOME}/rest_api_ds/certs/assertion_client.pem"
            private_key_path: "${DATA_HOME}/rest_api_ds/certs/assertion_client.key"
            aud: "http://localhost:8081/token"
            grant_type_key: "grant_type"
            grant_type_value: "urn:ietf:params:oauth:grant-type:jwt-bearer"
            headers:
              Content-Type: "application/json"
          headers:
            Accept: "application/json"
          responseFormat: "json"
          result_key: "students"
          retries:
            maxAttempts: 3
            delaySeconds: 5
          filepath: "${DATA_HOME}/rest_api_ds/api_oauth2_assertion_ds.json"
