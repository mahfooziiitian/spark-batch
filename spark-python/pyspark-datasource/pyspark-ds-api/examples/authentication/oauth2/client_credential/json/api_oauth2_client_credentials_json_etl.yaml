extracts:
  extract:
    exec: read_api
    source:
      params:
        format: "api"
        schema: "json"
        location: "http://localhost:8000/students"
        options:
          method: "GET"
          session_timeout: 30
          authentication:
            method: "POST"
            headers:
              Content-Type: "application/json"
            type: "oauth2_client_credentials_json"
            tokenUrl: "http://localhost:8000/token"
            client_id_key: "client_id"
            client_secret_key: "client_secret"
            client_id_value: "client_id_123"
            client_secret_value: "secret_abc"
            grant_type_key: "grant_type"
            grant_type_value: "client_credentials"
            # scope_key: "scope"
            # scope_value: "read write"
          headers:
            Accept: "application/json"
          responseFormat: "json"
          result_key: "students"
          retries:
            maxAttempts: 3
            delaySeconds: 5
          filepath: "s3://gwt-acuity-dev-oz-data-raw/rest_api/api_oauth2_client_credentials_json_etl.json"
