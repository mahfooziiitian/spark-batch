extracts:
  extract:
    exec: read_api
    source:
      params:
        format: "api"
        schema: "json"
        location: "http://127.0.0.1:8081/students"
        options:
          method: "GET"
          authentication:
            type: "apikey"
            in: "header"
            api_key_name: "x-api-key"
            # Non-secret fixture key shared with the local mock server only
            # (api_key_header_source.py); override via API_KEY_HEADER_DEMO_KEY
            # if you want a different value.
            api_key_value: "${API_KEY_HEADER_DEMO_KEY}"
            # caFile: "/home/malam2/development/learning/spark-batch/spark-python/pyspark-datasource/pyspark-ds-api/src/authentication/api_key/header/zscaler_root_ca.crt"
          headers:
            Accept: "application/json"
          queryParams:
            q: "London"
          responseFormat: "json"
          retries:
            maxAttempts: 3
            delaySeconds: 5
          filepath: "${DATA_HOME}/rest_api_ds/api_key_header.json"