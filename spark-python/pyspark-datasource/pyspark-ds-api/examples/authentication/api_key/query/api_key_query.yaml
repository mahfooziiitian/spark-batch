extracts:
  extract:
    exec: read_api
    source:
      params:
        format: "api"
        schema: "json"
        location: "https://api.openweathermap.org/data/2.5/weather"
        options:
          method: "GET"
          authentication:
            type: "apikey"
            in: "query"
            api_key_name: "appid"
            # Set OPENWEATHERMAP_API_KEY in your environment before running
            # this example; never commit real API keys to source control.
            api_key_value: "${OPENWEATHERMAP_API_KEY}"
            # caFile: "/home/malam2/development/learning/spark-batch/spark-python/pyspark-datasource/pyspark-ds-api/src/authentication/api_key/query/zscaler_root_ca.crt"
          headers:
            Accept: "application/json"
          queryParams:
            q: "Chennai"
          responseFormat: "json"
          result_key: "weather"
          retries:
            maxAttempts: 3
            delaySeconds: 5
          filepath: "${DATA_HOME}/rest_api_ds/api_key_query.json"