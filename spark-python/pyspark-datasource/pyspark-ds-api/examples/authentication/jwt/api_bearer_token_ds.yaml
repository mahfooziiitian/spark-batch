extracts:
  extract:
    exec: read_api
    source:
      params:
        format: "api"
        location: "https://acuity-ozd.cloud.databricks.com/api/2.1/clusters/list"
        options:
          method: "GET"
          authentication:
            type: "bearer"
            token: GET TOKEN FROM ENVIRONMENT VARIABLE
          headers:
            Accept: "application/json"
          queryParams:
            skip: 0
            limit: 100
          responseFormat: "json"
          retries:
            maxAttempts: 3
            delaySeconds: 5
          filepath: "${DATA_HOME}/rest_api_ds/api_bearer_token_ds.json"