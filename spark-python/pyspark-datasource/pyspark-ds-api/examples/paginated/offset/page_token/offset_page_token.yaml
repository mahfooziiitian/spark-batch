extracts:
  extract:
    exec: read_api
    source:
      params:
        format: "api"
        schema: "json"
        location: "http://localhost:8081/items"
        options:
          method: "GET"
          # authentication:
          #   method: "POST"
          #   headers:
          #     Content-Type: "application/x-www-form-urlencoded"
          #   type: "oauth2_form_client_credentials"
          #   tokenUrl: "https://accounts.spotify.com/api/token"
          #   clientId: "your-client-id"
          #   clientSecret: "your-client-secret"
          # scope: "read:data"
          pagination:
            strategy: "offset_page_token"
            page_token_key: "page_token"
            next_page_token_key: "next_page_token"
            limit_key: "limit"
            result_key: "data"
            limit: 20
          headers:
            Accept: "application/json"
          responseFormat: "json"
          retries:
            maxAttempts: 3
            delaySeconds: 5
          filepath: "${DATA_HOME}/rest_api_ds/offset_page_token.json"