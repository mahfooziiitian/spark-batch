extracts:
  extract:
    exec: read_api
    source:
      params:
        format: "api"
        schema: "json"
        # location: "https://api.spotify.com/v1/search"
        location: "http://localhost:8081/items"
        options:
          method: "GET"
          # authentication:
          #   method: "POST"
          #   headers:
          #     Content-Type: "application/x-www-form-urlencoded"
          #   type: "oauth2_form_client_credentials"
          #   tokenUrl: "https://accounts.spotify.com/api/token"
          #   clientId: "your-client-id"
          #   clientSecret: "your-client-secret"
          pagination:
            strategy: "page"
            page_number_key: "page"
            page_size_key: "page_size"
            total_items_key: "total"
            metadata_prefix: "meta"
            result_key: "data"
            page_size_value: 50
            start_page: 1
          headers:
            Accept: "application/json"
          queryParams:
            q: "daft punk"
            type: "artist"
          responseFormat: "json"
          retries:
            maxAttempts: 3
            delaySeconds: 5
          filepath: "${DATA_HOME}/rest_api_ds/paginated_page_number_ti_etl.json"