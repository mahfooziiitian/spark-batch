[project]
name = "pyspark-ds-api"
version = "0.1.0"
description = "REST API ingestion framework for PySpark — authentication, pagination, incremental ingestion"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Mahfooz Alam" }]
keywords = [
    "pyspark",
    "spark",
    "rest-api",
    "ingestion",
    "etl",
    "pagination",
    "oauth2",
    "incremental",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database :: Front-Ends",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    # Core Spark
    "pyspark<=3.5.5",
    # HTTP / REST
    "requests>=2.32.3",
    # Authentication
    "authlib>=1.6.0",
    "bcrypt==4.3.0",
    "cryptography>=45.0.4",
    "pyjwt>=2.10.1",
    # Config & environment
    "pyaml>=25.1.0",
    "python-dotenv>=1.1.0",
    # Incremental state store
    "sqlmodel>=0.0.24",
    # Mock API servers (examples)
    "faker>=37.4.0",
    "fastapi>=0.115.12",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34.0",
]

[project.urls]
Repository = "https://github.com/mahfooziiitian/spark-batch"
Documentation = "https://github.com/mahfooziiitian/spark-batch/tree/main/spark-python/pyspark-datasource/pyspark-ds-api"
Issues = "https://github.com/mahfooziiitian/spark-batch/issues"

[dependency-groups]
dev = [
    # Linting & formatting
    "black>=25.1.0",
    "flake8-pyproject>=1.2.3",
    "isort>=6.0.1",
    "ruff>=0.16.5",
    # Type checking
    "mypy>=2.3.1",
    # Testing
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-sugar>=1.0.0",
    "pytest-xdist>=3.5",
    "requests-mock>=1.12.1",
    # Security & quality
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "radon>=6.0.1",
    # Pre-commit hooks
    "pre-commit>=4.6.2",
    # Documentation
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
ignore = ['E203', 'E231', 'E241', 'W503']
per-file-ignores = ['__init__.py:F401']
max-line-length = 128
count = true
exclude = [".venv"]

[tool.ruff]
line-length = 128
target-version = "py311"
extend-exclude = [".venv", "site", "build", "dist"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
# E/W (pycodestyle) + F (pyflakes) mirror the existing flake8 setup; I
# (isort) is left to the dedicated `isort` tool already in the pipeline to
# avoid two tools fighting over import ordering.
select = ["E", "F", "W", "B", "C90", "UP", "SIM", "TCH"]
ignore = ["E231", "E241"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_decorators = true
exclude = ["examples/", "tests/", "\\.venv/"]

# Pre-existing legacy modules with untyped-optional patterns predating mypy
# adoption; relaxed here rather than reworked to keep this change scoped.
[[tool.mypy.overrides]]
module = ["rest_ds.rest_api", "rest_ds.util.certificate_util"]
disable_error_code = ["assignment", "arg-type"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "examples"]
skips = ["B101"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "integration: marks tests that start a mock server or need network",
    "slow: marks tests that take >10s to run",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyspark.*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rest_ds"]

[tool.hatch.build.targets.sdist]
include = ["src/rest_ds", "README.md"]

[tool.coverage.run]
source = ["rest_ds"]
branch = true
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
