site_name: pyspark-ds-api
site_description: REST API ingestion framework for Apache Spark
repo_name: pyspark-ds-api
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Authentication: authentication.md
  - Pagination: pagination.md
  - Incremental Ingestion: incremental-ingestion.md
  - Contributing: contributing.md
  - API Reference: reference.md

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

validation:
  nav:
    omitted_files: warn
  links:
    absolute_links: ignore
    unrecognized_links: warn
