site_name: PySpark HTML Datasource
site_description: PySpark HTML datasource reference — reading tables, scraping, parsing, and writing
site_url: ""
repo_url: https://github.com/mahfooziiitian/spark-batch
repo_name: mahfooziiitian/spark-batch

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started/index.md
  - Data Source:
      - data-source/index.md
      - data-source/reading-tables.md
      - data-source/scraping.md
      - data-source/writing.md
  - Parsing:
      - parsing/index.md
      - parsing/extract-links.md
      - parsing/extract-text.md
      - parsing/extract-meta.md
  - DataFrame:
      - dataframe/index.md
      - dataframe/create-dataframe.md
      - dataframe/transformations.md
      - dataframe/write-html.md
      - dataframe/pandas-bridge.md
