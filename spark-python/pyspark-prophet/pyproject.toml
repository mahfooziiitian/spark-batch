[tool.poetry]
name = "pysparkprophet"
version = "0.1.0"
description = ""
authors = ["mahfooz_iiitian <mahfooz.iiitian@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pyspark = "^3.5.1"
prophet = "^1.1.5"
ipykernel = "^6.29.5"
numpy = "1.26.4"
plotly = "^5.22.0"
nbformat = "^5.10.4"
jupyter = "^1.0.0"
ipywidgets = "^8.1.3"
pandas = "<3.0.0"
pyarrow = "^23.0.1"
matplotlib = "^3.10.8"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.5,<10.0.0)",
    "mkdocs-mermaid2-plugin (>=1.2.3,<2.0.0)",
    "mkdocs-minify-plugin (>=0.8.0,<0.9.0)",
    "pymdown-extensions (>=10.21,<11.0)"
]
