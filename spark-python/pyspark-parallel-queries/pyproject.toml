[project]
name = "pyspark-parallel-queries"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyspark<4.0.0"]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.5",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/parallel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
