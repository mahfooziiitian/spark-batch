# spark-defaults.conf — shared configuration for all cluster services
# Mounted read-only into master, workers, and history server.

# ── Event logging (powers the History Server) ─────────────────────────────────
spark.eventLog.enabled                                  true
spark.eventLog.dir                                      /opt/spark/events

# ── Adaptive Query Execution ───────────────────────────────────────────────────
spark.sql.adaptive.enabled                              true
spark.sql.adaptive.coalescePartitions.enabled           true

# ── Sensible shuffle default for a small local cluster ─────────────────────────
spark.sql.shuffle.partitions                            20

# ── Timezone consistency across driver and executors ──────────────────────────
spark.driver.extraJavaOptions                           -Duser.timezone=UTC
spark.executor.extraJavaOptions                         -Duser.timezone=UTC
