[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spp"]

[project]
name = "pyspark-pandas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy<2",
    "pandas<3",
    "pyarrow>=4",
    "pyspark<4",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "ipykernel>=7.2.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mypy>=1.20.1",
    "pandas-stubs>=2.0",
    "pytest-mock>=3.15.1",
    "pytest-sugar>=1.1.1",
    "radon>=6.0.1",
    "ruff>=0.15.10",
    "safety>=3.7.0",
]

[tool.mypy]
python_version = "3.11"
files = ["src/", "tests/"]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyspark.*", "py4j.*"]
ignore_missing_imports = true

# PySpark UDTF and pandas-UDF APIs have incomplete type stubs
[[tool.mypy.overrides]]
module = ["spp.udtf.*", "spp.pandas_udf.*"]
disable_error_code = ["call-overload", "arg-type", "call-arg", "union-attr", "attr-defined"]
