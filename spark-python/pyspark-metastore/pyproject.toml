[project]
name = "pyspark-metastore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=4.0.1",
]

[dependency-groups]
dev = [
    # Code quality
    "black[jupyter]>=25.9.0",
    "isort>=6.0.1",
    "mypy>=1.18.2",
    "ruff>=0.13.2",
    "flake8-pyproject>=1.2.3",
    "radon>=6.0.1",
    # Testing
    "pytest-sugar>=1.1.1",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest==8.4.1",
    "chispa>=0.11.1",
    # Security
    "bandit>=1.8.6",
    "safety>=3.6.2",
    # Tasks
    "taskipy>=1.14.1",
    # Docs
    "sphinxcontrib-mermaid>=1.0.0",
    "myst-parser>=4.0.1",
    "sphinxawesome-theme>=5.3.2",
    "furo>=2025.9.25",
    "linkify-it-py>=2.0.3",
    "pymarkdownlnt>=0.9.32",
    "ipytest>=0.14.2",
    "pytest-datadir>=1.8.0",
    "pyfakefs>=5.9.3",
    "sphinx-needs>=6.0.0",
    "sphinx-design>=0.6.1",
    # "sphinx-autoapi>=3.6.0",
    "ipykernel>=6.30.1",
]

[tool.sqlfluff.core]
dialect = "databricks"
templater = "python"
# templater = "jinja"
sql_file_exts = ".sql,.sql.j2,.dml,.ddl"

[tool.sqlfluff.indentation]
indented_joins = false
indented_using_on = true
template_blocks_indent = false

[tool.sqlfluff.templater]
unwrap_wrapped_queries = true

[tool.sqlfluff.templater.jinja]
apply_dbt_builtins = true

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
pythonpath = ["src"]
testpaths = ["tests", "integration"]
markers = [
    "integration: mark test as integration",
    "unit: mark test as unit",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
ignore_errors = true

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
ignore_missing_imports = true

[tool.flake8]
extend-ignore = "E203"
max-line-length = 128
exclude = [
    ".git",
    "__pycache__",
    "docs/source/conf.py",
    ".venv",
    "build",
    "dist",
]
max-complexity = 10

[tool.bandit]
targets = ["."]
exclude_dirs = ["tests", "migrations", ".venv"]
severity = "medium"
confidence = "high"
format = "json"

[tool.taskipy.tasks]
# test
test = "uv run pytest -vv tests"

# quality
sql_format = "echo '========== Starting sql_format =========='; uv run sqlfluff fix src; echo '========== Finished sql_format =========='"
sql_lint = "echo '========== Starting sql_lint =========='; uv run sqlfluff lint src; echo '========== Finished sql_lint =========='"
sql = "echo '========== Starting sql =========='; task sql_format && task sql_lint; echo '========== Finished sql =========='"
import = "echo '========== Starting import =========='; uv run isort --profile black src tests; echo '========== Finished import =========='"
lint = "echo '========== Starting lint =========='; uv run flake8 -v src tests; echo '========== Finished lint =========='"
type_check = "echo '========== Starting type_check =========='; uv run mypy src tests; echo '========== Finished type_check =========='"
format = "echo '========== Starting format =========='; uv run ruff format src tests; echo '========== Finished format =========='"
format_check = "echo '========== Starting format_check =========='; uv run ruff check src tests; echo '========== Finished format_check =========='"
quality = "echo '========== Starting quality =========='; task import && task format && task format_check && task lint && task type_check && task sql; echo '========== Finished quality =========='"

# Security
bandit = "echo '========== Starting bandit =========='; uv run bandit -c pyproject.toml -r src; echo '========== Finished bandit =========='"
safety = "echo '========== Starting safety =========='; uv run safety check --policy-file .safety-policy.yml; echo '========== Finished safety =========='"
secure = "echo '========== Starting secure =========='; task bandit && task safety; echo '========== Finished secure =========='"

# Build
build = "echo '========== Starting build =========='; uv build; echo '========== Finished build =========='"

# Reporting
report_html = "echo '========== Starting report_html =========='; uv run pytest --html=reports/reports.html --self-contained-html; echo '========== Finished report_html =========='"
report_xml = "echo '========== Starting report_xml =========='; uv run pytest --junitxml=reports/report.xml; echo '========== Finished report_xml =========='"
report_json = "echo '========== Starting report_json =========='; uv run pytest --json-report  --json-report-file=reports/report.json --cov-report=term-missing; echo '========== Finished report_json =========='"
report_json2 = "echo '========== Starting report_json2 =========='; uv run pytest --cov-report=json:reports/report.json --cov-report=term-missing; echo '========== Finished report_json2 =========='"
report_cov_html = "echo '========== Starting report_cov_html =========='; uv run pytest --cov=. --cov-report=html --cov-config=.coveragerc --cov-report=term-missing; echo '========== Finished report_cov_html =========='"
report_cov_xml = "echo '========== Starting report_cov_xml =========='; uv run pytest --cov=. --cov-report=xml --cov-config=.coveragerc --cov-report=term-missing; echo '========== Finished report_cov_xml =========='"
report_cov_annotate = "echo '========== Starting report_cov_annotate =========='; uv run pytest --cov=. --cov-report=annotate --cov-config=.coveragerc --cov-report=term-missing; echo '========== Finished report_cov_annotate =========='"

# clean up
remove_cache = "echo '========== Starting remove_cache =========='; if test -e __pycache__;then rm -rf __pycache__;fi; echo '========== Finished remove_cache =========='"
remove_pytest_cache = "echo '========== Starting remove_pytest_cache =========='; if test -e .pytest_cache; then rm -rf .pytest_cache pycache__;fi; echo '========== Finished remove_pytest_cache =========='"
remove_html_build = "echo '========== Starting remove_html_build =========='; if test -e docs/build; then rm -rf docs/build;fi; echo '========== Finished remove_html_build =========='"
clean = "echo '========== Starting clean =========='; task remove_cache && task remove_pytest_cache && task remove_html_build; echo '========== Finished clean =========='"

# Documentation
lint_md = "echo '========== Starting lint_md =========='; uv run pymarkdownlnt fix -r docs README.md; echo '========== Finished lint_md =========='"
sphinx_qs = "echo '========== Starting sphinx_qs =========='; uv run sphinx-quickstart docs; echo '========== Finished sphinx_qs =========='"
html = "echo '========== Starting html =========='; uv run sphinx-build -b html docs/source docs/build/html/; echo '========== Finished html =========='"
single_html = "echo '========== Starting single_html =========='; uv run sphinx-build -b singlehtml docs/source docs/build/singlehtml/; echo '========== Finished single_html =========='"
server = "echo '========== Starting server =========='; uv run python -m http.server -d ./docs/build/html 8080; echo '========== Finished server =========='"
html_server = "echo '========== Starting html_server =========='; task clean && task html && task server; echo '========== Finished html_server =========='"


