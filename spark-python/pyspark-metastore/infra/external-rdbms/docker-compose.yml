services:
  # PostgreSQL backend
  postgres:
    image: postgres:15-alpine
    container_name: metastore-postgres
    environment:
      POSTGRES_DB: ${METASTORE_DB_NAME:-metastore_db}
      POSTGRES_USER: ${METASTORE_DB_USER:-metastore}
      POSTGRES_PASSWORD: ${METASTORE_DB_PASSWORD:-metastore}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METASTORE_DB_USER:-metastore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

  # MySQL backend
  mysql:
    image: mysql:8.0
    container_name: metastore-mysql
    environment:
      MYSQL_DATABASE: ${METASTORE_DB_NAME:-metastore_db}
      MYSQL_USER: ${METASTORE_DB_USER:-metastore}
      MYSQL_PASSWORD: ${METASTORE_DB_PASSWORD:-metastore}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - mysql

  spark:
    build:
      context: ../..
      dockerfile: infra/common/Dockerfile
    container_name: spark-external
    environment:
      SPARK_MASTER: "local[*]"
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      SPARK_LOCAL_IP: "127.0.0.1"
    volumes:
      - ../../src:/workspace/src
      - ../../tests:/workspace/tests
    command: ["sleep", "infinity"]

volumes:
  postgres-data:
  mysql-data:
