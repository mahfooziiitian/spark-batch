services:
  metastore-db:
    image: postgres:15-alpine
    container_name: hive-metastore-db
    environment:
      POSTGRES_DB: ${HIVE_METASTORE_DB_NAME:-metastore}
      POSTGRES_USER: ${HIVE_METASTORE_DB_USER:-hive}
      POSTGRES_PASSWORD: ${HIVE_METASTORE_DB_PASSWORD:-hive}
    ports:
      - "${HIVE_METASTORE_DB_PORT:-5432}:5432"
    volumes:
      - metastore-db-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HIVE_METASTORE_DB_USER:-hive}"]
      interval: 10s
      timeout: 5s
      retries: 5

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore-db:5432/${HIVE_METASTORE_DB_NAME:-metastore}
        -Djavax.jdo.option.ConnectionUserName=${HIVE_METASTORE_DB_USER:-hive}
        -Djavax.jdo.option.ConnectionPassword=${HIVE_METASTORE_DB_PASSWORD:-hive}
    ports:
      - "${HIVE_METASTORE_PORT:-9083}:9083"
    depends_on:
      metastore-db:
        condition: service_healthy
    volumes:
      - hive-warehouse:/user/hive/warehouse

  spark:
    build:
      context: ../..
      dockerfile: infra/common/Dockerfile
    container_name: spark-hive
    environment:
      SPARK_MASTER: "local[*]"
      SPARK_WAREHOUSE: /user/hive/warehouse
      HIVE_METASTORE_URI: thrift://hive-metastore:9083
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      SPARK_LOCAL_IP: "127.0.0.1"
    volumes:
      - ../../src:/workspace/src
      - ../../tests:/workspace/tests
      - hive-warehouse:/user/hive/warehouse
    depends_on:
      - hive-metastore
    command: ["sleep", "infinity"]

volumes:
  metastore-db-data:
  hive-warehouse:
