services:
  minio:
    image: minio/minio:latest
    container_name: iceberg-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: iceberg-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing myminio/${S3_BUCKET:-warehouse};
      mc anonymous set public myminio/${S3_BUCKET:-warehouse};
      exit 0;
      "

  iceberg-rest:
    image: tabulario/iceberg-rest:1.5.0
    container_name: iceberg-rest-catalog
    environment:
      CATALOG_WAREHOUSE: "s3://${S3_BUCKET:-warehouse}/"
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    ports:
      - "${REST_CATALOG_PORT:-8181}:8181"
    depends_on:
      minio-init:
        condition: service_completed_successfully

  spark:
    build:
      context: ../..
      dockerfile: infra/common/Dockerfile
    container_name: spark-iceberg
    environment:
      SPARK_MASTER: "local[*]"
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      SPARK_LOCAL_IP: "127.0.0.1"
      REST_CATALOG_URI: http://iceberg-rest:8181
      REST_CATALOG_WAREHOUSE: "s3://${S3_BUCKET:-warehouse}/"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
    volumes:
      - ../../src:/workspace/src
      - ../../tests:/workspace/tests
    depends_on:
      - iceberg-rest
    command: ["sleep", "infinity"]

volumes:
  minio-data:
