services:
  namenode:
    image: apache/hadoop:3.3.6
    container_name: hadoop-namenode
    hostname: namenode
    environment:
      HADOOP_HOME: /opt/hadoop
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
    ports:
      - "8020:8020"
      - "9870:9870"
    volumes:
      - namenode-data:/tmp/hadoop-root/dfs/name
      - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    command: ["hdfs", "namenode"]
    healthcheck:
      test: ["CMD", "hdfs", "dfsadmin", "-safemode", "get"]
      interval: 15s
      timeout: 10s
      retries: 10

  datanode:
    image: apache/hadoop:3.3.6
    container_name: hadoop-datanode
    hostname: datanode
    environment:
      HADOOP_HOME: /opt/hadoop
    volumes:
      - datanode-data:/tmp/hadoop-root/dfs/data
      - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy

  spark:
    build:
      context: ../..
      dockerfile: infra/common/Dockerfile
    container_name: spark-hadoop
    environment:
      SPARK_MASTER: "local[*]"
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      SPARK_LOCAL_IP: "127.0.0.1"
      HADOOP_WAREHOUSE: hdfs://namenode:8020/warehouse
    volumes:
      - ../../src:/workspace/src
      - ../../tests:/workspace/tests
      - ./core-site.xml:/opt/spark/conf/core-site.xml
      - ./hdfs-site.xml:/opt/spark/conf/hdfs-site.xml
    depends_on:
      - datanode
    command: ["sleep", "infinity"]

volumes:
  namenode-data:
  datanode-data:
